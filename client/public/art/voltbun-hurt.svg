    <rect x="16" y="78" width="20" height="24" rx="5" fill="#FFC93C"/>
    <rect x="22" y="71" width="8" height="9" rx="3" fill="#E4D3B0"/>
    <g transform="rotate(-12 48 32)">
      <rect x="40" y="6" width="17" height="48" rx="8" fill="#FFF3D6"/>
      <path d="M40 24 L48.5 15 L57 24 L48.5 31 Z" fill="#2EC4B6"/>
